intro:"Chicago, 1949. Willard Libby (Nobel de Química, 1960) no se fía de su reloj radiactivo hasta probarlo con muestras de edad conocida, como madera de tumbas egipcias. Carbi lo resume: “un reloj solo vale si lo calibras con algo cuya hora ya conoces”. Hoy llegan al IIR tres baúles sin etiquetar. Dato: semivida del C-14 = 5.730 años; el C-14 se forma en la alta atmósfera por radiación cósmica. Los baúles contienen cuero A (25 %), madera B (12,5 %) y hueso C (0,05 %), como porcentaje del cociente C-14/C-12 de un organismo vivo actual."},
{t:"Nivel 2 · Fósiles vs. bombas atómicas: la alteración del reloj",min:.75,curve:{},
intro:"1955: Hans Suess descubre que los anillos de árboles recientes tienen menos C-14 de lo esperado: la quema de carbón y petróleo añade CO2 con carbono tan antiguo que ya no contiene C-14 (efecto Suess). Después, en la Guerra Fría, las pruebas nucleares generan C-14 extra. Dos acciones humanas desajustan el mismo reloj en sentidos opuestos. Heather Graven (Imperial College London) avisó en Nature de que las emisiones fósiles reducen la proporción de C-14 y podrían cambiar cómo datamos el pasado. La gráfica es didáctica (valores ilustrativos): C-14 atmosférico relativo (1,00 = nivel preindustrial)."},
{t:"Nivel 3 · El aire que respiramos: trazando las emisiones de CO2",min:.75,table:1,

const EX=[
"<b>Explicación.</b> Los isótopos son átomos del mismo elemento con distinto número de neutrones. El C-12 es estable; el C-14 es radiactivo y acaba convertido en N-14. Mientras vives, tu proporción C-14/C-12 es la del aire. Al morir, el C-14 se reduce a la mitad cada 5.730 años y el C-12 no cambia. Midiendo cuánto C-14 queda respecto al de un ser vivo se calcula el tiempo transcurrido. La técnica se agota hacia los 50.000 años.",
"<b>Explicación.</b> El reloj del C-14 supone una proporción atmosférica constante, pero no lo ha sido. El carbón y el petróleo contienen carbono sin C-14: al quemarlos diluyen la proporción (efecto Suess). Las pruebas nucleares liberaron neutrones que convirtieron nitrógeno en C-14 y la dispararon hacia 1963 (Bomb Spike). Después los océanos y la biosfera absorbieron el exceso y la curva baja. Leer bien la gráfica es calibrar el reloj.",
"<b>Explicación.</b> Una estación registra cuánto CO2 hay (ppm) y qué proporción de C-14 tiene. El CO2 de plantas y suelos lleva C-14; el de combustibles fósiles, no. Si el CO2 sube pero la proporción baja, el exceso es fósil. Con un balance de masas (ppm × proporción) calculas cuántas ppm son fósiles y compruebas si un informe industrial es coherente con lo medido.",
"<b>Explicación.</b> El marfil crece por capas, de la punta a la base, y cada capa fija el C-14 del momento en que se formó. Como las bombas dejaron una curva conocida (sube hasta 1963 y baja después), cada valor sirve de fecha. Un mismo valor puede darse en dos años, así que se comparan punta y base: si el valor sube o baja indica la rama de la curva. La clave legal: ¿la capa más reciente es anterior o posterior a 1989?",
"<b>Explicación.</b> Repaso de química: el C-14 se forma cuando un neutrón cósmico choca con N-14 (n + N-14 → C-14 + p), se oxida a CO2 y entra en las plantas por fotosíntesis y en los animales por la dieta. Al morir se desintegra por emisión beta: un neutrón pasa a protón y el C-14 se convierte en N-14. Los fósiles no tienen C-14 porque su carbono es antiguo. Las rocas se datan con otros isótopos."];
const L=OLD.map((l,i)=>({...l,q:Q[i],n:[6,5,5,6][i],ex:EX[i]})).concat([{t:"Nivel 5 · El Tribunal del Tiempo: la química del carbono",min:.8,n:6,ex:EX[4],q:Q[4],intro:"Sala del tribunal final. El juez científico exige justificarlo todo con la química del carbono: isótopos, formación y desintegración del C-14. Carbi te recuerda: el C-14 tiene 6 protones y 8 neutrones; el C-12, 6 protones y 6 neutrones. Semivida del C-14: 5.730 años. Aquí se mezcla todo lo aprendido: no hay atajos."}]);
const P=[[1850,1],[1900,.99],[1930,.975],[1950,.965],[1955,.99],[1958,1.2],[1963,1.9],[1970,1.5],[1980,1.25],[1990,1.15],[2000,1.08],[2020,1]];
const TB=[`<table><tr><th>Estación</th><th>CO2 (ppm)</th><th>Proporción C-14</th></tr><tr><td>A cima</td><td>400</td><td>1,000</td></tr><tr><td>B industrial</td><td>420</td><td>0,952</td></tr><tr><td>C ciudad</td><td>440</td><td>0,909</td></tr><tr><td>D bosque, noche</td><td>420</td><td>1,000</td></tr><tr><td>E junto a planta</td><td>410</td><td>1,000</td></tr></table>`,
`<table><tr><th>Colmillo</th><th>Punta</th><th>Base</th></tr><tr><td>1</td><td>1,00</td><td>1,35</td></tr><tr><td>2</td><td>1,70</td><td>1,35</td></tr><tr><td>3</td><td>1,10</td><td>1,05</td></tr></table>`];
function chart(c){const x=y=>0,X=v=>30+(v-1850)/170*290,Y=v=>140-(v-.9)/1.1*120;
let s=`<svg viewBox="0 0 340 160" role="img" aria-label="Curva didáctica de C-14 atmosférico"><line x1="30" y1="140" x2="325" y2="140" stroke="var(--mu)"/><line x1="30" y1="15" x2="30" y2="140" stroke="var(--mu)"/><polyline fill="none" stroke="var(--or)" stroke-width="3" points="${P.map(p=>X(p[0])+","+Y(p[1])).join(" ")}"/><text x="30" y="154" font-size="10" fill="var(--mu)">1850</text><text x="300" y="154" font-size="10" fill="var(--mu)">2020</text><text x="2" y="${Y(1)+3}" font-size="10" fill="var(--mu)">1,0</text><text x="2" y="${Y(1.9)+3}" font-size="10" fill="var(--mu)">1,9</text>`;
if(c.ref)s+=`<line x1="30" x2="325" y1="${Y(c.ref)}" y2="${Y(c.ref)}" stroke="var(--pl)" stroke-dasharray="4"/><text x="200" y="${Y(c.ref)-4}" font-size="10" fill="var(--pl)">1989 ≈ 1,15</text>`;
return `<div class="sc">${s}</svg></div>`}
const K="c14-iir";let S;
const fresh=()=>({on:0,l:0,i:0,si:1,sc:[[],[],[],[],[]],p:null,w:0,exits:0,log:[],blocked:0,end:0,brk:0,done:0,resets:0});
try{S=JSON.parse(localStorage.getItem(K))||fresh()}catch(e){S=fresh()}
while(S.sc.length<5)S.sc.push([]);const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let ord=[],ordK="",bad=[],fb=null,warn="";
const A=document.getElementById("app");
const bar=()=>`<div class="bar"><span>${"❤️".repeat(Math.max(0,4-S.exits))}${"🖤".repeat(Math.min(4,S.exits))} salidas: ${S.exits}/4</span><span>${S.on&&!S.done?"Sesión "+(S.l<2?1:2):""}</span></div>`;
const say=t=>`<div class="carbi"><div class="face">◕‿◕</div><p class="say">${t}</p></div>`;
function ex(){const m=["Salida 1 de 4. Aviso: el IIR registra cada vez que dejas el laboratorio.","Salida 2 de 4. Quedan 2 salidas.","Salida 3 de 4. Solo queda 1.","Salida 4 de 4. Última salida: la próxima bloquea la partida."];return m[S.exits-1]||""}
function render0(){let h="";
if(S.blocked){A.innerHTML=`<div class="card"><h2>Partida bloqueada</h2><p>Has abandonado la pantalla de juego 5 veces. Pierdes la partida y debes reiniciar desde el Nivel 1. El registro queda guardado para tu profesor.</p><p><small>${S.log.join("<br>")}</small></p><button class="go" id="rs">Reiniciar desde el Nivel 1</button></div>`;
document.getElementById("rs").onclick=()=>{S={...fresh(),resets:S.resets+1};save();render()};return}
if(!S.on){A.innerHTML=`<div class="card">${say("¡Hola, aprendiz! Soy Carbi, un átomo de C-14. Bienvenido al Instituto Internacional de Radiocarbono.")}<h1>Operación Carbono-14</h1><p>Cinco niveles, dos sesiones de una hora. Para superar cada nivel necesitas la puntuación mínima; las pistas restan puntos.</p><p><b>Reglas:</b> prohibido salir de esta pestaña para buscar información. Tienes <b>4 salidas</b> en total entre las dos sesiones. A la quinta, la partida se bloquea y vuelves al Nivel 1. Para parar entre sesiones usa “Guardar y terminar sesión”.</p><button class="go" id="st">${S.l||S.i?"Continuar":"Empezar"}</button></div>`;
document.getElementById("st").onclick=()=>{S.on=1;save();render()};return}
if(S.end){A.innerHTML=`<div class="card"><h2>Sesión guardada</h2><p>Ya puedes cerrar la pestaña sin gastar salidas. Vuelve a abrir esta página para continuar con el Nivel 3.</p><button class="go" id="cn">Continuar sesión 2</button></div>`;
document.getElementById("cn").onclick=()=>{S.end=0;S.brk=0;save();render()};return}
if(S.done){const t=S.sc.flat().reduce((a,b)=>a+b,0),m=S.sc.flat().length*10;A.innerHTML=`<div class="card"><h2>Certificado de perito forense del IIR</h2>${say("¡Caso cerrado! Has dominado el reloj de Carbi.")}<p>Puntuación total: <b>${t}/${m}</b><br>Salidas usadas: <b>${S.exits}/4</b><br>Reinicios por bloqueo: ${S.resets}</p><button class="go alt" id="rs">Volver a jugar</button></div>`;
document.getElementById("rs").onclick=()=>{S=fresh();S.on=1;save();render()};return}
const lv=L[S.l];h+=bar()+(warn?`<div class="warn">${warn}</div>`:"");
if(S.brk){A.innerHTML=h+`<div class="card"><h2>Fin de la sesión 1</h2>${say("Dos niveles superados. Guarda para seguir otro día o continúa ahora.")}<button class="go" id="sv">Guardar y terminar sesión</button> <button class="go alt" id="kp">Seguir jugando</button></div>`;
document.getElementById("sv").onclick=()=>{S.end=1;save();render()};document.getElementById("kp").onclick=()=>{S.brk=0;save();render()};return}
if(S.si){A.innerHTML=h+`<div class="card"><h2>${lv.t}</h2>${say(lv.intro)}<p>${lv.ex}</p>${lv.curve?chart(lv.curve):""}</div><button class="go" id="gn">Empezar el reto</button>`;
document.getElementById("gn").onclick=()=>{S.si=0;S.p=null;ordK="";save();render()};return}
if(S.i>=lv.n){const s=S.sc[S.l].reduce((a,b)=>a+b,0),m=lv.n*10,ok=s/m>=lv.min;
A.innerHTML=h+`<div class="card"><h2>${ok?"¡Nivel superado!":"Casi…"}</h2><p>Puntuación: <b>${s}/${m}</b> (mínimo ${Math.round(lv.min*100)} %).</p><button class="go" id="nx">${ok?"Siguiente":"Repetir el nivel"}</button></div>`;
document.getElementById("nx").onclick=()=>{if(ok){if(S.l==L.length-1){S.done=1}else{S.l++;S.i=0;S.si=1;S.w=0;S.p=null;if(S.l==2)S.brk=1}}else{S.sc[S.l]=[];S.i=0;S.w=0;S.p=null;ordK=""}save();render()};return}
if(!S.p||S.p.length!=lv.n)S.p=lv.q.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,lv.n);const q=lv.q[S.p[S.i]],key=S.l+"-"+S.i;if(ordK!==key){ord=q.o.map((_,i)=>i).sort(()=>Math.random()-.5);ordK=key;bad=[];fb=null}
const hs=q.h.slice(0,Math.min(S.w,3)).map(t=>`<div class="hint">💡 ${t}</div>`).join("");
h+=`<div class="card"><small>${lv.t} · pregunta ${S.i+1}/${lv.n}</small>${lv.table?TB[lv.table-1]:""}${lv.curve&&lv.curve.ref?chart(lv.curve):""}<h2 style="font-size:19px">${q.q}</h2>`;
ord.forEach(i=>{const c=fb!==null&&i==q.a?" ok":bad.includes(i)?" no":"";h+=`<button class="opt${c}" data-i="${i}" ${fb!==null||bad.includes(i)?"disabled":""}>${q.o[i]}</button>`});
h+=hs+(fb!==null?`<p>✔ +${fb} puntos.</p><button class="go" id="nq">Continuar</button>`:"")+"</div>";
A.innerHTML=h;A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
if(i==q.a){fb=Math.max(10-2*Math.min(S.w,3),4);S.sc[S.l][S.i]=fb;save()}else{bad.push(i);S.w++;save()}render()});
const nq=document.getElementById("nq");if(nq)nq.onclick=()=>{S.i++;S.w=0;fb=null;save();render()}}
let tm=0,pm="";
const $=i=>document.getElementById(i);
function render(){if(tm){teach();return}render0();const b=document.createElement("button");b.className="go alt";b.textContent="Modo profesor";b.style.cssText="font-size:12px;padding:5px 10px;margin-top:8px";b.onclick=()=>{tm=1;pm="";render()};A.appendChild(b)}
function teach(){
if(tm==1){A.innerHTML=`<div class="card"><h2>Modo profesor</h2><p>Introduce la clave.</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" style="font:inherit;padding:8px;border-radius:10px;border:2px solid var(--ln);background:var(--card);color:var(--tx)"><p>${pm}</p><button class="go" id="ok">Entrar</button> <button class="go alt" id="bk">Volver</button></div>`;
$("ok").onclick=()=>{if($("pin").value==="1111"){tm=2}else{pm="Clave incorrecta."}render()};$("bk").onclick=()=>{tm=0;render()};return}
A.innerHTML=`<div class="card"><h2>Modo profesor</h2><p>Nivel actual: <b>${S.l+1}</b> · Salidas: <b>${S.exits}/4</b> · Reinicios: <b>${S.resets}</b> · Estado: <b>${S.blocked?"bloqueada":S.done?"terminada":"en curso"}</b></p><p><small>Registro de salidas:<br>${S.log.join("<br>")||"ninguna"}</small></p><button class="go" id="r1">Reiniciar partida (Nivel 1)</button> <button class="go alt" id="r2">Desbloquear y devolver salidas</button><p>Saltar a un nivel:</p>${[0,1,2,3,4].map(n=>`<button class="go alt" data-n="${n}">${n+1}</button>`).join(" ")}<p><button class="go alt" id="cl">Cerrar modo profesor</button></p></div>`;
$("r1").onclick=()=>{S={...fresh(),resets:S.resets+1};save();tm=0;render()};
$("r2").onclick=()=>{S.blocked=0;S.exits=0;save();render()};
A.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;S.l=n;S.i=0;S.si=1;S.w=0;S.p=null;ordK="";S.sc[n]=[];S.on=1;S.brk=0;S.end=0;S.done=0;S.blocked=0;save();tm=0;render()});
$("cl").onclick=()=>{tm=0;render()}}
document.addEventListener("visibilitychange",()=>{
if(document.hidden){if(S.on&&!S.end&&!S.blocked&&!S.done&&!tm){S.exits++;S.log.push(new Date().toLocaleString("es-ES"));if(S.exits>4)S.blocked=1;warn=ex();save()}}
else render()});
render();
</script></body></html>
